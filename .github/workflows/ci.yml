name: Reproducibility checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install matched dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check retained source integrity
        run: python reproduce.py integrity
      - name: Report environment
        run: python reproduce.py doctor
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Small numerical execution check
        run: python reproduce.py smoke --run-dir runs/ci-smoke
      - name: Recheck archived paper results
        run: python reproduce.py verify --run-dir runs/ci-verify
      - name: Regenerate paper figures and tables
        run: python reproduce.py figures --run-dir runs/ci-figures
      - name: Save run evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-checks
          path: |
            runs/*/run_manifest.json
            runs/*/checks/
            runs/*/logs/
            runs/*/figures/
            runs/*/tables/
            runs/*/paper_results.md
          if-no-files-found: warn
          retention-days: 30
